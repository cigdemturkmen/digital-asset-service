# Local development infrastructure for asset-service.
# Spring Boot's Docker Compose support starts this file on `./mvnw spring-boot:run`
# and derives the datasource URL/credentials from the container below.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: assets
      POSTGRES_USER: asset
      POSTGRES_PASSWORD: asset-local-only
    ports:
      - "15432:5432" # fixed host port for database GUIs; 15432 avoids clashing with a local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql # PostgreSQL 18 images keep their data under this path

volumes:
  pgdata:
    name: asset-pgdata
